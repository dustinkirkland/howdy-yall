name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make deps
      - run: make all
      - run: make test-readonly
      - run: make test-install

  wolfi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # wolfi-act copies the runner's environment into its container, including
      # XDG_RUNTIME_DIR (/run/user/1001), which does not exist there; dotnet
      # publish then fails to create its NuGet-Migrations mutex. Unset it.
      - uses: wolfi-dev/wolfi-act@main
        with:
          packages: build-base,apk-tools
          command: unset XDG_RUNTIME_DIR && make deps && make all && make test-readonly && make test-install
